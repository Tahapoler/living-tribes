yaml


name: Build Living Tribes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make JAR
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: living-tribes-jar
          path: build/libs/*.jar
          if-no-files-found: error
